; platformio.ini — Configuración base para M5Stack Cardputer (ESP32-S3, StampS3)

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; El Cardputer usa el USB nativo del ESP32-S3 (CDC/JTAG), no un chip UART externo.
; Estas flags habilitan el puerto USB como salida serial para Serial.print().
build_flags =
    -DARDUINO_USB_MODE=1        ; Usa el USB nativo, no UART
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Habilita CDC (Communications Device Class) al arrancar
; Sin -DBOARD_HAS_PSRAM: el StampS3 del Cardputer (ESP32-S3FN8) NO tiene PSRAM.
; Lo confirma el eFuse PSRAM_CAP = None (espefuse.py summary). Con el flag, el core
; intentaba inicializarla al arrancar y fallaba: "PSRAM ID read error: 0x00ffffff".

; Tabla de particiones con espacio para OTA y SPIFFS/LittleFS.
; Debe caber en la flash REAL (8 MB en el StampS3). El bootloader de segunda
; etapa (esp_partition_table_verify) rechaza cualquier partición que exceda el
; tamaño de flash de su cabecera y reinicia el chip: con default_16MB.csv el
; dispositivo entraba en bucle de arranque y nunca ejecutaba setup().
board_build.partitions = default_8MB.csv

; Velocidad del monitor serial
monitor_speed = 115200

; Librería base de M5Stack — la vamos a usar inicialmente y luego la iremos reemplazando
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5Cardputer@^1.0.1